<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smitss Music Player</title>
    <link href="./style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="card" style="width: 18rem;">
            <img src="./images/flowerbg.png" class="card-img-top" id="song_img" alt="...">
            <div class="card-body">
                <h5 class="card-title" id="song_name">Song Name</h5>
                <p class="card-text" id="artist">Artist</p>
            </div>
            <ul class="list-group list-group-flush">
                </li>
                <li class="list-group-item timeline-container">

                    <span class="time-display current-time">0:00</span>

                    <input type="range" class="progress-slider" min="0" max="100" value="0">

                    <span class="time-display total-duration">3:45</span>

                </li>
                <li class="list-group-item list1">
                    <div><button type="button" class="btn btn-outline-dark previous"><img
                                src="./images/back.png"></button></div>
                    <div><button type="button" class="btn btn-outline-dark status"><img
                                src="./images/play (1).png"></button></div>
                    <div><button type="button" class="btn btn-outline-dark next"><img src="./images/next.png"></button>
                    </div>


        </div>
    </div>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

    <script src="./script.js"></script>
</body>

</html>
